<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TanStack Realtime — Multi-User Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        background: #f5f5f5;
      }
      .panel {
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px;
        margin: 8px;
      }
      .panel h2 {
        font-size: 13px;
        font-weight: 600;
        color: #555;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      input[type='text'] {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 13px;
        width: 100%;
        margin-bottom: 6px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
        margin-right: 4px;
        margin-top: 4px;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      button.danger {
        background: #dc2626;
      }
      button.danger:hover {
        background: #b91c1c;
      }
      .list-item {
        background: #f9f9f9;
        border: 1px solid #eee;
        border-radius: 4px;
        padding: 6px 8px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tag {
        background: #e5e7eb;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 11px;
      }
      #app {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        padding: 8px;
        gap: 0;
      }
      .status-bar {
        background: #1e293b;
        color: white;
        padding: 8px 12px;
        font-size: 12px;
        display: flex;
        gap: 16px;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: #6b7280;
      }
      .dot.connected {
        background: #22c55e;
      }
      .dot.disconnected {
        background: #ef4444;
      }
      .dot.connecting {
        background: #f59e0b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/client.tsx"></script>
  </body>
</html>
