name: Deploy Docs

# Production docs deploy. Publishes the built docs site to the ROOT of the
# `gh-pages` branch. Per-PR previews (see docs-preview.yml) live under
# `gh-pages/pr-preview/`, so this deploy uses `clean-exclude: pr-preview/` to
# avoid wiping live previews on every push to main.
#
# ONE-TIME OWNER SETUP (cannot be done from CI): in the repo's GitHub
# Settings -> Pages, set the build source to "Deploy from a branch:
# gh-pages / (root)". GitHub Pages allows only one source, so both production
# and previews are served from the single gh-pages branch.
#   Production: https://mikn.github.io/tanstack-realtime/
#   Previews:   https://mikn.github.io/tanstack-realtime/pr-preview/pr-<N>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm --filter @realtimejs/docs build

      - name: Add .nojekyll
        run: touch packages/docs/dist/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: packages/docs/dist
          clean-exclude: pr-preview/
