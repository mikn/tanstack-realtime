<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>realtime.js — Reactive Queries</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #111;
        padding: 24px;
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      p.sub {
        color: #666;
        font-size: 13px;
        margin-bottom: 16px;
      }
      p.sub code {
        background: #e5e7eb;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 12px;
      }
      .add {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input[type='text'] {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 14px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button.ghost {
        background: #e5e7eb;
        color: #111;
        padding: 4px 8px;
      }
      button.ghost:hover {
        background: #d1d5db;
      }
      .todo {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .todo.done span.text {
        text-decoration: line-through;
        color: #9ca3af;
      }
      .todo .text {
        flex: 1;
        font-size: 14px;
      }
      .votes {
        font-variant-numeric: tabular-nums;
        min-width: 28px;
        text-align: center;
        font-size: 13px;
      }
      .status {
        font-size: 12px;
        color: #666;
        margin-bottom: 16px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        background: #9ca3af;
      }
      .dot.connected {
        background: #22c55e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
