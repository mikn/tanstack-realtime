<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>realtime.js — PartyKit</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #111;
        height: 100vh;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        height: 100vh;
      }
      .sidebar {
        background: #1e293b;
        color: #e2e8f0;
        padding: 16px;
        display: flex;
        flex-direction: column;
      }
      .sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-bottom: 8px;
      }
      .users {
        list-style: none;
      }
      .users li {
        padding: 4px 0;
        font-size: 14px;
      }
      .users li.me {
        color: #38bdf8;
        font-weight: 600;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: #64748b;
        flex: 1;
      }
      .status {
        font-size: 12px;
        color: #94a3b8;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        background: #64748b;
      }
      .dot.connected {
        background: #22c55e;
      }
      .provider {
        margin-top: 6px;
        font-size: 11px;
        color: #475569;
      }
      .stage {
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 16px;
      }
      .stage h1 {
        font-size: 18px;
      }
      .reactions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .reactions button {
        font-size: 24px;
        line-height: 1;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }
      .reactions button:hover {
        background: #eff6ff;
        border-color: #93c5fd;
      }
      .feed {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .empty {
        font-size: 13px;
        color: #6b7280;
        font-style: italic;
      }
      .reaction {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 6px 10px;
        max-width: 220px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reaction.own {
        background: #dbeafe;
        align-self: flex-end;
      }
      .reaction .emoji {
        font-size: 20px;
      }
      .reaction .from {
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
